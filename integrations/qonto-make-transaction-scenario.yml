arazzo: 1.0.1
info:
  title: Qonto Transaction to Make Scenario
  summary: Run a Make scenario with a Qonto transaction as its input.
  version: 1.0.0
x-integration:
  partner: make
  template: null
  edge_evidence: https://qonto.com/en/integrations
  edge_type: claimed
  method: generated
  generated: '2026-10-12'
  generator: pipeline step 25b (payments-integration-arazzo)
sourceDescriptions:
  - name: qontoTransactionsApi
    url: https://raw.githubusercontent.com/api-evangelist/qonto/refs/heads/main/openapi/qonto-transactions-and-statements-api-openapi.yml
    type: openapi
  - name: makeScenarioExecutionApi
    url: https://raw.githubusercontent.com/api-evangelist/make/refs/heads/main/openapi/make-scenario-execution-api-openapi.yml
    type: openapi
workflows:
  - workflowId: qonto-transaction-to-make-scenario
    summary: Read a Qonto transaction and execute a Make scenario with it.
    inputs:
      type: object
      required: [transactionId, scenarioId]
      properties:
        transactionId: {type: string}
        scenarioId: {type: string}
    steps:
      - stepId: get-transaction
        description: Retrieve the Qonto transaction.
        operationId: $sourceDescriptions.qontoTransactionsApi.getTransaction
        parameters:
          - name: id
            in: path
            value: $inputs.transactionId
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          label: $response.body#/transaction/label
          amount: $response.body#/transaction/amount
          currency: $response.body#/transaction/currency
          settledAt: $response.body#/transaction/settled_at
      - stepId: run-scenario
        description: Execute the Make scenario, passing the transaction fields as data.
        operationId: $sourceDescriptions.makeScenarioExecutionApi.runScenario
        parameters:
          - name: scenarioId
            in: path
            value: $inputs.scenarioId
        requestBody:
          contentType: application/json
          payload:
            data:
              transactionId: $inputs.transactionId
              label: $steps.get-transaction.outputs.label
              amount: $steps.get-transaction.outputs.amount
              currency: $steps.get-transaction.outputs.currency
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          executionId: $response.body#/executionId
    outputs:
      executionId: $steps.run-scenario.outputs.executionId
